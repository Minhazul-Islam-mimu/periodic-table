<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>🧪 মজার পর্যায় সারণি — বাচ্চাদের জন্য</title>
<style>
:root{
  --bg1:#fff3d6; --bg2:#c9f4ff; --bg3:#ffd6ec;
  --card:#ffffff; --text:#2b2140; --muted:#6b6280;
  --accent:#ff6b6b; --accent2:#4ecdc4; --accent3:#ffd93d;
  --shadow: 0 8px 24px rgba(60,40,90,.14);
  --radius: 18px;

  --c-alkali-metal:#c0392b;
  --c-alkaline-earth:#e08e0b;
  --c-transition-metal:#1f6f8b;
  --c-post-transition:#276749;
  --c-metalloid:#7d3c98;
  --c-nonmetal:#1f8a4c;
  --c-halogen:#b8860b;
  --c-noble-gas:#5b3ea5;
  --c-lanthanide:#a8326a;
  --c-actinide:#a83232;
  --c-unknown:#555568;
}
[data-theme="dark"]{
  --bg1:#181228; --bg2:#131b2e; --bg3:#221530;
  --card:#221a35; --text:#f1ecff; --muted:#b3a9d1;
  --shadow: 0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Baloo 2','Segoe UI',system-ui,'Noto Sans Bengali',sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  transition:background .4s ease,color .4s ease;
  padding-bottom:60px;
}
.large-text body, body.large-text{ font-size:1.15em; }
a{color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
button:focus-visible, input:focus-visible, .elbox:focus-visible{
  outline:3px solid var(--accent2); outline-offset:2px;
}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 40px;}

/* HEADER */
header.top{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:16px;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo .emoji{font-size:2.4rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.logo h1{font-size:1.5rem;margin:0;}
.logo p{margin:0;color:var(--muted);font-size:.85rem;}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}
.pillbtn{
  background:var(--card);color:var(--text);padding:9px 14px;border-radius:999px;
  box-shadow:var(--shadow);font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:6px;
  transition:transform .15s ease;
}
.pillbtn:hover{transform:translateY(-2px) scale(1.04);}
.pillbtn.active{background:var(--accent);color:#fff;}

/* TOOLBAR */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.search-box{
  flex:1;min-width:200px;position:relative;
}
.search-box input{
  width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:none;
  background:var(--card);box-shadow:var(--shadow);color:var(--text);font-size:1rem;
}
.search-box::before{content:"🔍";position:absolute;left:14px;top:11px;font-size:1.1rem;}
.filters{display:flex;flex-wrap:wrap;gap:6px;}
.filter-btn{
  background:var(--card);padding:8px 13px;border-radius:12px;font-size:.8rem;font-weight:700;
  box-shadow:var(--shadow);color:var(--text);
}
.filter-btn.active{background:var(--accent2);color:#fff;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px;}
.stat-chip{background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow);}
.stat-chip b{display:block;font-size:1.3rem;}
.stat-chip span{font-size:.72rem;color:var(--muted);}

/* PROGRESS */
.progress-wrap{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);}
.progress-wrap .plabel{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:6px;}
.progress-bar{height:12px;background:rgba(120,120,120,.2);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent3));border-radius:8px;transition:width .5s ease;}
.badges{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.badge{font-size:.7rem;padding:4px 9px;border-radius:999px;background:rgba(120,120,120,.15);font-weight:700;}
.badge.earned{background:var(--accent3);color:#2b2140;}

/* TABLE GRID */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.legend-chip{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;background:var(--card);padding:5px 10px;border-radius:999px;box-shadow:var(--shadow);}
.legend-dot{width:12px;height:12px;border-radius:50%;}

.table-scroll{overflow-x:auto;padding-bottom:10px;}
.grid{
  display:grid;
  grid-template-columns:repeat(18,minmax(46px,1fr));
  gap:4px;
  min-width:920px;
}
.gridcell{width:100%;height:100%;min-width:0;}
.elbox{
  position:relative;border-radius:9px;padding:4px 3px;color:#fff;
  width:100%;height:100%;aspect-ratio:1/1;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  font-weight:700;text-align:center;overflow:hidden;
  min-width:0;
}
.elbox .n{position:absolute;top:2px;left:4px;font-size:.55rem;font-weight:600;opacity:.85;}
.elbox .s{font-size:1.05rem;line-height:1;}
.elbox .nm{font-size:.42rem;line-height:1;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;width:92%;}
.elbox .fav-star{position:absolute;top:1px;right:2px;font-size:.6rem;}
.elbox:hover, .elbox.learn-active{
  transform:scale(1.28);z-index:20;box-shadow:0 10px 26px rgba(0,0,0,.4);
  filter:brightness(1.12);
}
.elbox.dim{opacity:.18;}
.elbox.hidden-el{display:none;}
.ghost{visibility:hidden;}

/* category colors */
.cat-alkali-metal{background:linear-gradient(150deg,var(--c-alkali-metal),#7b1e15);}
.cat-alkaline-earth{background:linear-gradient(150deg,var(--c-alkaline-earth),#8f560b);}
.cat-transition-metal{background:linear-gradient(150deg,var(--c-transition-metal),#123f4f);}
.cat-post-transition{background:linear-gradient(150deg,var(--c-post-transition),#123b28);}
.cat-metalloid{background:linear-gradient(150deg,var(--c-metalloid),#4a2260);}
.cat-nonmetal{background:linear-gradient(150deg,var(--c-nonmetal),#0e4d29);}
.cat-halogen{background:linear-gradient(150deg,var(--c-halogen),#6b4c05);}
.cat-noble-gas{background:linear-gradient(150deg,var(--c-noble-gas),#331f5c);}
.cat-lanthanide{background:linear-gradient(150deg,var(--c-lanthanide),#5c1a3d);}
.cat-actinide{background:linear-gradient(150deg,var(--c-actinide),#5c1616);}
.cat-unknown{background:linear-gradient(150deg,var(--c-unknown),#2b2b36);}

/* tooltip */
.tooltip{
  position:fixed;pointer-events:none;background:#1c1330;color:#fff;padding:8px 12px;
  border-radius:10px;font-size:.75rem;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.4);
  max-width:220px;opacity:0;transition:opacity .12s ease;line-height:1.5;
}
.tooltip.show{opacity:1;}
.tooltip b{font-size:.85rem;}

/* buttons row */
.actions-row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.bigbtn{
  background:var(--card);padding:12px 18px;border-radius:16px;font-weight:800;font-size:.9rem;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;color:var(--text);
  transition:transform .15s ease;
}
.bigbtn:hover{transform:translateY(-3px);}
.bigbtn.primary{background:linear-gradient(135deg,var(--accent),#ff9a6b);color:#fff;}
.bigbtn.green{background:linear-gradient(135deg,var(--accent2),#2fb8ae);color:#fff;}
.bigbtn.purple{background:linear-gradient(135deg,#a374ff,#7b4fd6);color:#fff;}
.bigbtn.yellow{background:linear-gradient(135deg,var(--accent3),#ffb703);color:#2b2140;}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(20,10,35,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--card);border-radius:24px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
  padding:26px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:pop .28s cubic-bezier(.2,1.4,.5,1);
}
@keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal .close{
  position:absolute;top:14px;right:14px;background:rgba(120,120,120,.18);width:34px;height:34px;
  border-radius:50%;font-size:1.1rem;display:flex;align-items:center;justify-content:center;color:var(--text);
}
.modal .head{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.modal .bigsym{
  width:84px;height:84px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:2.3rem;font-weight:900;color:#fff;flex-shrink:0;
}
.modal h2{margin:0 0 3px;font-size:1.4rem;}
.modal .sub{color:var(--muted);font-size:.85rem;}
.modal .fav-toggle{margin-left:auto;font-size:1.5rem;background:none;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;}
.info-item{background:rgba(120,120,120,.1);border-radius:12px;padding:8px 10px;}
.info-item .lbl{font-size:.68rem;color:var(--muted);font-weight:700;}
.info-item .val{font-size:.9rem;font-weight:700;}
.section-title{font-weight:800;margin:14px 0 6px;font-size:.95rem;display:flex;align-items:center;gap:6px;}
.section-text{font-size:.88rem;line-height:1.6;color:var(--text);background:rgba(120,120,120,.08);padding:10px 12px;border-radius:12px;}
.kid-bubble{
  background:linear-gradient(135deg,#fff3d6,#ffd6ec);color:#2b2140;border-radius:16px;padding:12px 14px;
  font-size:.9rem;line-height:1.6;position:relative;font-weight:600;
}
[data-theme="dark"] .kid-bubble{background:linear-gradient(135deg,#3a2a55,#4a2a45);color:#fff;}

/* electron orbital animation */
.orbit-wrap{display:flex;justify-content:center;margin:6px 0;}
.orbit-wrap svg{max-width:260px;width:100%;height:auto;}
.orbit-ring{fill:none;stroke:rgba(150,140,190,.35);stroke-width:1.5;}
[data-theme="dark"] .orbit-ring{stroke:rgba(200,190,255,.25);}
.electron-dot{filter:drop-shadow(0 0 4px currentColor);}
.nucleus-circle{filter:drop-shadow(0 0 8px rgba(255,107,107,.6));}
.shell-legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px;}
.shell-chip{font-size:.68rem;font-weight:700;background:rgba(120,120,120,.12);padding:3px 9px;border-radius:999px;}
@media (prefers-reduced-motion: reduce){
  .orbit-wrap animateTransform{ }
}

/* quiz */
.quiz-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);max-width:520px;margin:0 auto;}
.quiz-q{font-size:1.1rem;font-weight:800;margin-bottom:14px;text-align:center;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quiz-opt{background:rgba(120,120,120,.12);padding:14px;border-radius:14px;font-weight:700;font-size:.95rem;color:var(--text);}
.quiz-opt.correct{background:#3bb273;color:#fff;animation:pulse .4s ease;}
.quiz-opt.wrong{background:#e05555;color:#fff;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
.quiz-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;font-size:.85rem;color:var(--muted);}

/* fun fact */
.fact-card{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);max-width:520px;margin:0 auto;text-align:center;}

/* learn mode voice bubble */
.voice-bubble{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--card);border-radius:20px;padding:14px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  max-width:90%;width:420px;z-index:900;display:none;
}
.voice-bubble.show{display:block;animation:pop .25s ease;}
.voice-bubble .vb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.voice-bubble .vb-nav{display:flex;gap:6px;}
.voice-bubble .vb-nav button{background:var(--accent2);color:#fff;padding:6px 12px;border-radius:10px;font-weight:700;font-size:.8rem;}
.voice-bubble .vb-nav button.stop{background:#e05555;}

/* confetti */
.confetti-piece{position:fixed;top:-10px;width:8px;height:14px;z-index:1500;}

section.panel{display:none;}
section.panel.show{display:block;}

footer.credit{text-align:center;color:var(--muted);font-size:.75rem;margin-top:30px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

@media(max-width:700px){
  .grid{grid-template-columns:repeat(18,minmax(34px,1fr));}
  .elbox .nm{display:none;}
  .info-grid{grid-template-columns:1fr;}
  .quiz-opts{grid-template-columns:1fr;}
}
[data-contrast="high"]{--card:#000;--text:#fff;--muted:#ddd;--bg1:#000;--bg2:#000;--bg3:#000;}
[data-contrast="high"] body{background:#000;}
[data-contrast="high"] .elbox{border:2px solid #fff;}
</style>
</head>
<body>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
<div class="wrap">

<header class="top">
  <div class="logo">
    <span class="emoji">🧪</span>
    <div>
      <h1>মজার পর্যায় সারণি</h1>
      <p>খেলতে খেলতে ১১৮টি মৌল শিখো!</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="pillbtn" id="darkToggle">🌙 ডার্ক মোড</button>
    <button class="pillbtn" id="contrastToggle">🔆 হাই কনট্রাস্ট</button>
    <button class="pillbtn" id="textToggle">🔠 বড় টেক্সট</button>
    <button class="pillbtn" id="fullscreenBtn">⛶ ফুলস্ক্রিন</button>
    <button class="pillbtn" id="printBtn">🖨️ প্রিন্ট</button>
  </div>
</header>

<div class="progress-wrap">
  <div class="plabel"><span>📈 তোমার শেখার অগ্রগতি</span><span id="progressText">0 / 118</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="badges" id="badges"></div>
</div>

<div class="stats-bar" id="statsBar"></div>

<nav class="actions-row" aria-label="মোড নির্বাচন">
  <button class="bigbtn primary" data-panel="tablePanel">🔬 পর্যায় সারণি</button>
  <button class="bigbtn green" data-panel="quizPanel">🎯 কুইজ খেলো</button>
  <button class="bigbtn yellow" id="learnBtn">🎓 লার্ন মোড</button>
  <button class="bigbtn purple" id="factBtn">💡 মজার তথ্য</button>
  <button class="bigbtn" id="compareBtn">⚖️ তুলনা করো</button>
  <button class="bigbtn" id="randomBtn">🎲 র‍্যান্ডম মৌল</button>
  <button class="bigbtn" id="favBtn">⭐ প্রিয় তালিকা</button>
  <button class="bigbtn" id="pngBtn">🖼️ PNG ডাউনলোড</button>
  <button class="bigbtn" id="soundToggle">🔊 সাউন্ড</button>
</nav>

<section class="panel show" id="tablePanel">
  <div class="toolbar">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="নাম, সিম্বল বা নাম্বার লিখে সার্চ করো..." aria-label="মৌল খুঁজুন">
    </div>
  </div>
  <div class="filters" id="filters"></div>

  <div class="legend" id="legend"></div>

  <div class="table-scroll">
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="panel" id="quizPanel">
  <div class="quiz-card">
    <div class="quiz-top">
      <span>স্কোর: <b id="quizScore">0</b></span>
      <span>সেরা স্কোর: <b id="quizHigh">0</b></span>
      <span>প্রশ্ন: <b id="quizCount">0</b>/10</span>
    </div>
    <div class="quiz-q" id="quizQ">কুইজ শুরু করতে নিচের বাটনে চাপো!</div>
    <div class="quiz-opts" id="quizOpts"></div>
    <div style="text-align:center;margin-top:16px;">
      <button class="bigbtn green" id="quizStart">🚀 কুইজ শুরু করো</button>
    </div>
  </div>
</section>

</div>

<div class="voice-bubble" id="voiceBubble">
  <div class="vb-top">
    <b id="vbTitle"></b>
    <div class="vb-nav">
      <button id="vbNext">পরবর্তী ▶</button>
      <button class="stop" id="vbStop">⏹ থামাও</button>
    </div>
  </div>
  <div id="vbText"></div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="overlay" id="factOverlay">
  <div class="modal" style="max-width:420px;text-align:center;">
    <button class="close" id="factClose">✕</button>
    <div class="fact-card" id="factCardInner" style="box-shadow:none;padding:6px;"></div>
  </div>
</div>

<div class="overlay" id="compareOverlay">
  <div class="modal" style="max-width:620px;">
    <button class="close" id="compareClose">✕</button>
    <h2>⚖️ দুটি মৌল তুলনা করো</h2>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <select id="cmp1" style="flex:1;padding:10px;border-radius:10px;min-width:140px;"></select>
      <select id="cmp2" style="flex:1;padding:10px;border-radius:10px;min-width:140px;"></select>
    </div>
    <div id="compareResult"></div>
  </div>
</div>

/* ================== SOUND (WebAudio, no files) ================== */
let actx;
function beep(freq, dur, type){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

  return `<button class="elbox ${catClass(e.cat)}" data-num="${e.num}" tabindex="0"
    aria-label="${e.name}, প্রতীক ${e.sym}, পারমাণবিক সংখ্যা ${e.num}">
    <span class="n">${e.num}</span>
    <span class="fav-star">${star}</span>
    <span class="s">${e.sym}</span>
    <span class="nm">${e.name}</span>
  </button>`;
}

function buildGrid(){
  let html = '';
  ELEMENTS.forEach(e => {
    let row, col;
    if(e.num >= 57 && e.num <= 71){ row = 9; col = (e.num - 57) + 3; }
    else if(e.num >= 89 && e.num <= 103){ row = 10; col = (e.num - 89) + 3; }
    else { row = e.period; col = e.group; }
    html += `<div class="gridcell" style="grid-row:${row};grid-column:${col};">${elBoxHTML(e)}</div>`;
  });
  // spacer row + placeholder markers pointing to lanthanide/actinide rows below
  html += `<div class="gridcell" style="grid-row:8;grid-column:1;height:10px;"></div>`;
  html += `<div class="gridcell elbox cat-lanthanide" style="grid-row:6;grid-column:3;opacity:.75;font-size:.55rem;">57-71</div>`;
  html += `<div class="gridcell elbox cat-actinide" style="grid-row:7;grid-column:3;opacity:.75;font-size:.55rem;">89-103</div>`;
  grid.innerHTML = html;
  attachGridEvents();
}
buildGrid();

function attachGridEvents(){
  document.querySelectorAll('.elbox[data-num]').forEach(box=>{
    const num = parseInt(box.dataset.num,10);
    const e = byNum[num];
    box.addEventListener('mouseenter', ev => showTooltip(ev, e));
    box.addEventListener('mousemove', ev => moveTooltip(ev));
    box.addEventListener('mouseleave', hideTooltip);
    box.addEventListener('focus', ev => showTooltip(ev, e));
    box.addEventListener('blur', hideTooltip);
    box.addEventListener('click', ()=>{ sfx.click(); openModal(e); });
    box.addEventListener('keydown', ev=>{ if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); sfx.click(); openModal(e); } });
  });

const tooltip = document.getElementById('tooltip');
function showTooltip(ev, e){
  tooltip.innerHTML = `<b>${e.emoji} ${e.name} (${e.sym})</b><br>পারমাণবিক সংখ্যা: ${e.num}<br>ভর: ${e.mass}<br>${e.catBn}`;

function moveTooltip(ev){
  const rect = ev.target.closest('.elbox').getBoundingClientRect();
  let x = rect.left + rect.width/2 - 90;
  let y = rect.top - 100;
  if(y < 10) y = rect.bottom + 10;
  x = Math.max(8, Math.min(x, window.innerWidth - 236));
  tooltip.style.left = x+'px';
  tooltip.style.top = y+'px';
}
function hideTooltip(){ tooltip.classList.remove('show'); }

/* ================== ELECTRON ORBITAL ANIMATION ================== */
const SHELL_LETTERS = ['K','L','M','N','O','P','Q'];
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function buildOrbitalSVG(e){
  const shells = e.shells;
  const cx = 200, cy = 200;
  const colors = ['#ff6b6b','#4ecdc4','#ffd93d','#a374ff','#3bb273','#ff9ecb','#5eb0ff'];
  let svg = `<svg viewBox="0 0 400 400" role="img" aria-label="${e.name} এর ইলেকট্রন কক্ষপথ, মোট ${e.num}টি ইলেকট্রন">`;
  // rings
  shells.forEach((count, k)=>{
    const r = 30 + k*27;
    svg += `<circle class="orbit-ring" cx="${cx}" cy="${cy}" r="${r}"></circle>`;
  });
  // nucleus
  svg += `<circle class="nucleus-circle" cx="${cx}" cy="${cy}" r="16" fill="#ff6b6b"></circle>`;
  svg += `<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${e.sym}</text>`;
  // electrons per shell, grouped so the whole shell rotates together
  shells.forEach((count, k)=>{
    const r = 30 + k*27;
    const dur = (2 + k*1.3).toFixed(1);
    const color = colors[k % colors.length];
    svg += `<g>`;
    for(let i=0;i<count;i++){
      const angle = (360/count)*i;
      const rad = angle*Math.PI/180;
      const x = cx + r*Math.cos(rad);
      const y = cy + r*Math.sin(rad);
      svg += `<circle class="electron-dot" cx="${x}" cy="${y}" r="5" fill="${color}" style="color:${color}"></circle>`;
    }
    if(!reducedMotion){
      svg += `<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="360 ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"></animateTransform>`;
    }
    svg += `</g>`;
  });
  svg += `</svg>`;
  return svg;
}
function shellLegendHTML(shells){
  return shells.map((c,k)=>`<span class="shell-chip">${SHELL_LETTERS[k]||('n='+(k+1))} শেল: ${c}টি</span>`).join('');
}

  {id:'nonmetal', label:'💨 অধাতু'},

  {id:'synthetic', label:'🧫 কৃত্রিম'},
];
let activeFilter = 'all';
filtersDiv.innerHTML = FILTERS.map(f=>`<button class="filter-btn ${f.id==='all'?'active':''}" data-f="${f.id}">${f.label}</button>`).join('');
filtersDiv.addEventListener('click', ev=>{
  const btn = ev.target.closest('.filter-btn'); if(!btn) return;
  sfx.click();
  activeFilter = btn.dataset.f;
  [...filtersDiv.children].forEach(b=>b.classList.toggle('active', b===btn));
  filterAndRender();
});

const METAL_CATS = ['alkali-metal','alkaline-earth','transition-metal','post-transition','lanthanide','actinide'];
function passFilter(e){
  switch(activeFilter){
    case 'all': return true;
    case 'metal': return METAL_CATS.includes(e.cat);
    case 'nonmetal': return e.cat==='nonmetal' || e.cat==='halogen';
    case 'metalloid': return e.cat==='metalloid';
    case 'gas': return e.state==='gas';
    case 'liquid': return e.state==='liquid';
    case 'solid': return e.state==='solid';
    case 'radioactive': return e.radioactive;
    case 'synthetic': return e.synthetic;
    default: return true;
  }
}
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', filterAndRender);
function filterAndRender(){
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.elbox[data-num]').forEach(box=>{
    const e = byNum[parseInt(box.dataset.num,10)];
    const matchesSearch = !q || e.name.toLowerCase().includes(q) || e.sym.toLowerCase().includes(q) || String(e.num)===q;
    const matchesFilter = passFilter(e);
    box.classList.toggle('hidden-el', !(matchesSearch && matchesFilter));
  });
}

/* ================== QUIZ MODE ================== */
document.getElementById('quizHigh').textContent = highScore;
let quizScore = 0, quizCount = 0, quizPool = [], quizAnswer = null, quizLocked = false;
const QMAX = 10;
document.getElementById('quizStart').addEventListener('click', ()=>{
  sfx.click();
  quizScore = 0; quizCount = 0;
  document.getElementById('quizScore').textContent = quizScore;
  document.getElementById('quizCount').textContent = quizCount;
  nextQuestion();
});
function randOptions(correct, pool, key){
  const opts = new Set([correct]);
  while(opts.size < 4){
    const r = pool[Math.floor(Math.random()*pool.length)][key];
    opts.add(r);
  }
  return shuffle([...opts]);
}
function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function nextQuestion(){
  quizLocked = false;
  if(quizCount >= QMAX){ return finishQuiz(); }
  quizCount++;
  document.getElementById('quizCount').textContent = quizCount;
  const e = ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
  const type = Math.floor(Math.random()*4);
  let qText, options, correct;
  if(type===0){
    qText = `"${e.sym}" প্রতীকটি কোন মৌলের?`;
    correct = e.name;
    options = randOptions(correct, ELEMENTS, 'name');
  } else if(type===1){
    qText = `${e.name} মৌলের প্রতীক কোনটি?`;
    correct = e.sym;
    options = randOptions(correct, ELEMENTS, 'sym');
  } else if(type===2){
    qText = `${e.name} (${e.sym}) এর পারমাণবিক সংখ্যা কত?`;
    correct = String(e.num);
    const opts = new Set([correct]);
    while(opts.size<4){ opts.add(String(Math.max(1,Math.min(118, e.num + (Math.floor(Math.random()*11)-5))))); }
    options = shuffle([...opts]);
  } else {
    qText = `${e.name} (${e.sym}) কোন ক্যাটাগরির মৌল?`;
    correct = e.catBn;
    options = randOptions(correct, ELEMENTS, 'catBn');
  }
  quizAnswer = correct;
  document.getElementById('quizQ').textContent = qText;
  document.getElementById('quizOpts').innerHTML = options.map(o=>`<button class="quiz-opt" data-v="${encodeURIComponent(o)}">${o}</button>`).join('');
  [...document.querySelectorAll('.quiz-opt')].forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(quizLocked) return;
      quizLocked = true;
      const val = decodeURIComponent(btn.dataset.v);
      if(val === quizAnswer){
        btn.classList.add('correct'); quizScore++; sfx.correct();
      } else {
        btn.classList.add('wrong'); sfx.wrong();
        [...document.querySelectorAll('.quiz-opt')].forEach(b=>{ if(decodeURIComponent(b.dataset.v)===quizAnswer) b.classList.add('correct'); });
      }
      document.getElementById('quizScore').textContent = quizScore;
      setTimeout(nextQuestion, 1000);
    });
  });
}
function finishQuiz(){
  document.getElementById('quizOpts').innerHTML = '';
  document.getElementById('quizQ').innerHTML = `🎉 কুইজ শেষ! তুমি পেয়েছো ${quizScore}/${QMAX}`;
  if(quizScore > highScore){
    highScore = quizScore;
    localStorage.setItem(LS.high, highScore);
    document.getElementById('quizHigh').textContent = highScore;
    sfx.achieve();
  }
  if(quizScore >= QMAX*0.7) launchConfetti();
}

/* ================== CONFETTI ================== */
function launchConfetti(){
  const colors = ['#ff6b6b','#4ecdc4','#ffd93d','#a374ff','#3bb273'];
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    const duration = 2000 + Math.random()*1500;
    const anim = p.animate([
      { transform:`translateY(0) rotate(0deg)`, opacity:1 },
      { transform:`translateY(${window.innerHeight+50}px) rotate(${Math.random()*720}deg)`, opacity:1 }
    ], { duration, easing:'ease-in' });
    anim.onfinish = ()=> p.remove();
  }
}

/* ================== KEYBOARD SHORTCUTS ================== */
document.addEventListener('keydown', ev=>{
  if(ev.target.tagName==='INPUT') return;
  if(ev.key==='/'){ ev.preventDefault(); searchInput.focus(); }
  if(ev.key==='d'){ darkToggle.click(); }
  if(ev.key==='q'){ document.querySelector('[data-panel="quizPanel"]').click(); }
  if(ev.key==='t'){ document.querySelector('[data-panel="tablePanel"]').click(); }
});

/* ================== SOUND TOGGLE ================== */
const soundToggleBtn = document.getElementById('soundToggle');
function refreshSoundBtn(){
  soundToggleBtn.textContent = soundOn ? '🔊 সাউন্ড অন' : '🔇 সাউন্ড অফ';
  soundToggleBtn.classList.toggle('active', soundOn);
}
soundToggleBtn.addEventListener('click', ()=>{
  soundOn = !soundOn;
  localStorage.setItem(LS.sound, soundOn ? 'on':'off');
  refreshSoundBtn();
  sfx.click();
});
refreshSoundBtn();

/* ================== PNG EXPORT (pure canvas, no libraries) ================== */
document.getElementById('pngBtn').addEventListener('click', ()=>{
  sfx.click();
  const cols = 18, rows = 10, cell = 60, pad = 20;
  const canvas = document.createElement('canvas');
  canvas.width = cols*cell + pad*2;
  canvas.height = rows*cell + pad*2 + 40;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fdf6e3';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#2b2140';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('মজার পর্যায় সারণি — Periodic Table', pad, pad+10);
  const catColor = {
    'alkali-metal':'#c0392b','alkaline-earth':'#e08e0b','transition-metal':'#1f6f8b',
    'post-transition':'#276749','metalloid':'#7d3c98','nonmetal':'#1f8a4c','halogen':'#b8860b',
    'noble-gas':'#5b3ea5','lanthanide':'#a8326a','actinide':'#a83232','unknown':'#555568'
  };
  ELEMENTS.forEach(e=>{
    let row,col;
    if(e.num>=57&&e.num<=71){row=9;col=(e.num-57)+3;}
    else if(e.num>=89&&e.num<=103){row=10;col=(e.num-89)+3;}
    else {row=e.period; col=e.group;}
    const x = pad + (col-1)*cell, y = pad + 40 + (row-1)*cell;
    ctx.fillStyle = catColor[e.cat] || '#888';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x+2,y+2,cell-4,cell-4,8) : ctx.rect(x+2,y+2,cell-4,cell-4);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '9px sans-serif';
    ctx.fillText(e.num, x+6, y+14);
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(e.sym, x+8, y+38);
  });
  const link = document.createElement('a');
  link.download = 'periodic-table.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

/* init */
filterAndRender();

</script>
